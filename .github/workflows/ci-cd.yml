name: Execution CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy no Kubernetes configurado
        type: boolean
        default: false
permissions:
  contents: read
  security-events: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-coverage
          path: target/site/jacoco/
          if-no-files-found: warn
      - name: SonarCloud (quando configurado)
        if: github.event_name != 'pull_request' && vars.SONAR_PROJECT_KEY != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" && test -n "$SONAR_ORGANIZATION"
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.projectKey="$SONAR_PROJECT_KEY" -Dsonar.organization="$SONAR_ORGANIZATION" -Dsonar.qualitygate.wait=true
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - run: mvn -B -DskipTests package
      - uses: github/codeql-action/analyze@v4
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: [verify, codeql]
    runs-on: [self-hosted, linux, oficina-deploy]
    environment: homolog
    permissions:
      contents: read
    env:
      AWS_PROFILE: fiap-lab
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'oficina-prod' }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar pré-requisitos
        run: |
          set -eu
          test -n "$EKS_CLUSTER_NAME" && test -n "$ECR_REPOSITORY_URL"
          aws sts get-caller-identity --query Arn --output text >/dev/null
      - name: Publicar imagem por commit no ECR
        run: |
          set -eu
          IMAGE="${ECR_REPOSITORY_URL}:${GITHUB_SHA}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%/*}"
          if ! aws ecr describe-images --repository-name "${ECR_REPOSITORY_URL##*/}" --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Aplicar manifests e validar rollout
        run: |
          set -eu
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --kubeconfig "$KUBECONFIG" >/dev/null
          kubectl -n "$K8S_NAMESPACE" get secret oficina-execution-config >/dev/null
          kubectl kustomize k8s/ | sed "s|image: oficina-execution:local|image: $IMAGE|" | kubectl -n "$K8S_NAMESPACE" apply -f -
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/oficina-execution --timeout=300s
